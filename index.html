    <!-- 跨域/纯静态部署（如 GitHub Pages、CFSM-Theme-Store 托管）时取消注释并填入后端地址，

    <!-- 正文网页字体（MiSans VF）不在此处硬编码：CFSM 会对主题 HTML 下发

         控制台报错。改由 src/utils/webFont.ts 读取实际策略后按需注入。 -->
